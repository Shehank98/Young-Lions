<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PULSE</title>
<style>
/*
  PULSE — Blood Donation Campaign
  Audience Mobile Experience
  ─────────────────────────────────────────────────────────────
  API CONTRACT (set CONFIG.mock = false for real backend):
    GET  /api/state  → { stage: number, taps: number }
    POST /api/tap    → {} (records a donation tap)
  ─────────────────────────────────────────────────────────────
*/

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #080c14;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  color: #f0f4ff;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#app {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 10vh 7vw 8vh;
  position: relative;
  overflow: hidden;
  transition: background 1.6s ease;
}

/* ── STATUS ── */
#status {
  position: fixed;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; letter-spacing: 0.15em;
  color: #8899bb;
  z-index: 50;
  text-transform: uppercase;
}
#status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #334;
  transition: background 0.5s, box-shadow 0.5s;
}
#status-dot.live {
  background: #00e87a;
  box-shadow: 0 0 8px #00e87a;
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── BPM ── */
#bpm-wrap {
  text-align: center;
  z-index: 2;
  width: 100%;
}
#bpm-num {
  font-size: clamp(76px, 22vw, 128px);
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1;
  color: #00e87a;
  text-shadow: 0 0 50px #00e87a;
  transition: color 1.5s ease, text-shadow 1.5s ease;
  display: inline-block;
}
#bpm-label {
  font-size: clamp(11px, 3.5vw, 16px);
  letter-spacing: 0.35em;
  color: #8899bb;
  margin-top: 5px;
  text-transform: uppercase;
}

/* ── ECG CANVAS ── */
#ecg-wrap {
  width: 100%; height: 22vh;
  z-index: 2;
  position: relative;
}
#ecg {
  width: 100%; height: 100%;
  display: block;
}

/* ── MESSAGE ── */
#msg {
  text-align: center;
  z-index: 2;
  width: 100%;
  min-height: 18vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
}
#msg-title {
  font-size: clamp(20px, 6.5vw, 34px);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0; transform: translateY(12px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
#msg-sub {
  font-size: clamp(13px, 4vw, 18px);
  color: #8899bb;
  line-height: 1.5;
  opacity: 0; transform: translateY(12px);
  transition: opacity 0.7s ease 0.18s, transform 0.7s ease 0.18s;
}
.show-msg #msg-title, .show-msg #msg-sub {
  opacity: 1; transform: translateY(0);
}

/* ── TAP OVERLAY ── */
#tap-overlay {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 20;
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease;
  background: rgba(8, 12, 20, 0.6);
  backdrop-filter: blur(2px);
}
#tap-overlay.on { opacity: 1; pointer-events: all; }

#tap-btn {
  width: min(58vw, 230px); height: min(58vw, 230px);
  border-radius: 50%;
  border: 2.5px solid #ff3b5c;
  box-shadow: 0 0 30px #ff3b5c66, inset 0 0 25px rgba(255,59,92,.08);
  background: rgba(255,59,92,.06);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  cursor: pointer;
  position: relative;
  overflow: visible;
  animation: tapGlow 2.2s ease-in-out infinite;
  transition: transform 0.1s, border-color 0.8s, box-shadow 0.8s, background 0.8s;
}
#tap-btn.donated {
  border-color: #00e87a;
  box-shadow: 0 0 40px #00e87a66, inset 0 0 30px rgba(0,232,122,.1);
  background: rgba(0,232,122,.07);
  animation: tapGlowGreen 2.2s ease-in-out infinite;
}
@keyframes tapGlow {
  0%,100%{box-shadow:0 0 20px #ff3b5c66}
  50%{box-shadow:0 0 50px #ff3b5caa, 0 0 0 18px rgba(255,59,92,0)}
}
@keyframes tapGlowGreen {
  0%,100%{box-shadow:0 0 20px #00e87a66}
  50%{box-shadow:0 0 50px #00e87aaa, 0 0 0 18px rgba(0,232,122,0)}
}
#tap-btn:active { transform: scale(0.9); }

#tap-icon { font-size: 42px; }
#tap-label {
  font-size: clamp(12px, 3.5vw, 15px);
  font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #ff3b5c;
  transition: color 0.8s;
}
#tap-btn.donated #tap-label { color: #00e87a; }
#tap-check {
  font-size: 24px;
  opacity: 0; transform: scale(0.5);
  transition: opacity 0.4s, transform 0.4s;
  position: absolute; top: 16px; right: 20px;
}
#tap-btn.donated #tap-check { opacity: 1; transform: scale(1); }

#tap-total {
  margin-top: 22px;
  font-size: 13px; letter-spacing: 0.12em;
  color: #8899bb;
}

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  border: 2px solid currentColor;
  animation: rippleOut 0.9s ease-out forwards;
  pointer-events: none;
}
@keyframes rippleOut {
  0% { width: 90%; height: 90%; top: 5%; left: 5%; opacity: .8; }
  100% { width: 210%; height: 210%; top: -55%; left: -55%; opacity: 0; }
}

/* ── BEAT PULSE ── */
@keyframes beat {
  0%{transform:scale(1)} 18%{transform:scale(1.14)} 35%{transform:scale(1)}
}
.beating { animation: beat 0.38s ease-out; }

/* ── CONNECTING SCREEN ── */
#connecting {
  position: fixed; inset: 0;
  background: #080c14;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; z-index: 100;
  transition: opacity 1s ease;
}
#connecting.gone { opacity: 0; pointer-events: none; }

#connect-heart {
  font-size: 60px;
  animation: heartPop 1.8s ease-in-out infinite;
}
@keyframes heartPop {
  0%,100%{transform:scale(1); opacity:.5}
  50%{transform:scale(1.1); opacity:1}
}
#connect-label {
  font-size: 12px; letter-spacing: 0.3em;
  color: #8899bb; text-transform: uppercase;
}
#connect-dots span {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: #334;
  margin: 0 3px;
  animation: dotFade 1.2s ease-in-out infinite;
}
#connect-dots span:nth-child(2){animation-delay:.2s}
#connect-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotFade {0%,100%{background:#334;transform:scale(1)}50%{background:#0af;transform:scale(1.3)}}

/* ── SAVED SCREEN ── */
#saved {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 30;
  opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease;
}
#saved.on { opacity: 1; }
#saved-num {
  font-size: clamp(88px, 28vw, 150px);
  font-weight: 900; line-height: 1;
  color: #00e87a;
  text-shadow: 0 0 80px #00e87a;
  letter-spacing: -0.04em;
}
#saved-label {
  font-size: clamp(14px, 5vw, 22px);
  letter-spacing: 0.25em; text-transform: uppercase;
  color: #8899bb;
}
#saved-sub {
  font-size: clamp(12px, 3.8vw, 16px);
  color: #f0f4ff; opacity: 0.65;
  text-align: center; padding: 0 24px;
  line-height: 1.6;
  max-width: 320px;
}

/* ── CONFETTI ── */
.conf {
  position: fixed;
  top: -12px;
  border-radius: 3px;
  animation: fall linear forwards;
  pointer-events: none;
  z-index: 200;
}
@keyframes fall {
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  85%{opacity:1}
  100%{transform:translateY(108vh) rotate(680deg);opacity:0}
}
</style>
</head>
<body>

<div id="status">
  <div id="status-dot"></div>
  <span id="status-text">WAITING</span>
</div>

<div id="connecting">
  <div id="connect-heart">❤️</div>
  <div id="connect-label">Syncing to presenter</div>
  <div id="connect-dots"><span></span><span></span><span></span></div>
</div>

<div id="app">
  <div id="bpm-wrap">
    <div id="bpm-num">72</div>
    <div id="bpm-label">BPM</div>
  </div>

  <div id="ecg-wrap">
    <canvas id="ecg"></canvas>
  </div>

  <div id="msg">
    <div id="msg-title"></div>
    <div id="msg-sub"></div>
  </div>
</div>

<div id="tap-overlay">
  <div id="tap-btn">
    <div id="tap-icon">🩸</div>
    <div id="tap-label">Tap to Donate</div>
    <div id="tap-check">✓</div>
  </div>
  <div id="tap-total">0 people donated</div>
</div>

<div id="saved">
  <div id="saved-num">0</div>
  <div id="saved-label">Lives Saved</div>
  <div id="saved-sub">Through your collective action, PULSE changed everything.</div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────
const CONFIG = {
  mock: false,         // true = localStorage (single device demo)
                      // false = real backend (multi device)
  apiBase: '/api',    // Change to your backend URL when mock = false
  pollMs: 900,
};

// ─── STAGE DEFINITIONS ───────────────────────────────────────
const STAGES = [
  { id:0, bpm:72, amp:.5, color:'#0088ff', bg:'#080c14',
    title:'', sub:'',
    tap:false, saved:false, vibrate:null },

  { id:1, bpm:72, amp:.62, color:'#00e87a', bg:'#030e07',
    title:'YOUR HEART IS BEATING',
    sub:'5 litres of blood. 72 times a minute. Right now.',
    tap:false, saved:false, vibrate:null },

  { id:2, bpm:50, amp:.52, color:'#ff8c00', bg:'#110800',
    title:"BUT SOMEONE'S ISN'T",
    sub:'Australia is 1.5 million blood units short — every single year.',
    tap:false, saved:false, vibrate:[180,80,180] },

  { id:3, bpm:22, amp:.36, color:'#ff3b5c', bg:'#180306',
    title:'EVERY 2 SECONDS',
    sub:'Someone needs blood. Right now. Waiting.',
    tap:false, saved:false, vibrate:[500,200,600] },

  { id:4, bpm:22, amp:.28, color:'#ff3b5c', bg:'#180306',
    title:'ONE TAP.', sub:'One donation. One life.',
    tap:true, saved:false, vibrate:null },

  { id:5, bpm:88, amp:.68, color:'#00e87a', bg:'#031209',
    title:'PULSE IS LIVE',
    sub:"Your heartbeat just saved someone else's.",
    tap:true, saved:false, vibrate:[80,40,80,40,80] },

  { id:6, bpm:96, amp:.72, color:'#00e87a', bg:'#020a04',
    title:'', sub:'',
    tap:false, saved:true, vibrate:[200,100,200,100,500] },
];

// ─── BACKEND ADAPTER ─────────────────────────────────────────
const Backend = {
  _key: 'pulse_state',
  _def: () => ({ stage: 0, taps: 0 }),

  async getState() {
    if (CONFIG.mock) {
      try { return JSON.parse(localStorage.getItem(this._key)) || this._def(); }
      catch { return this._def(); }
    }
    const r = await fetch(`${CONFIG.apiBase}/state`);
    return r.json();
  },

  async tap() {
    if (CONFIG.mock) {
      const s = await this.getState();
      s.taps = (s.taps || 0) + 1;
      localStorage.setItem(this._key, JSON.stringify(s));
    } else {
      await fetch(`${CONFIG.apiBase}/tap`, { method: 'POST' });
    }
  }
};

// ─── ECG RENDERER ────────────────────────────────────────────
class ECG {
  constructor(canvas) {
    this.c = canvas;
    this.x = canvas.getContext('2d');
    this.buf = new Array(320).fill(0.5);
    this.bpm = 72;
    this.amp = 0.62;
    this.color = '#00e87a';
    this.fc = 0;
    this.fpb = this._fpb(72); // frames per beat
    this.q = [];              // spike queue
    this.onBeat = null;
    this.raf = null;
    this._resize();
    window.addEventListener('resize', () => this._resize());
  }

  _fpb(bpm) { return Math.max(6, Math.round(3600 / bpm)); }

  _resize() {
    const dpr = window.devicePixelRatio || 1;
    this.c.width  = this.c.clientWidth  * dpr;
    this.c.height = this.c.clientHeight * dpr;
    this.x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  set(bpm, amp, color) {
    this.bpm = bpm; this.amp = amp; this.color = color;
    this.fpb = this._fpb(bpm);
  }

  _spike() {
    const a = this.amp, m = 0.5;
    return [
      m, m, m,
      m-0.05*a, m-0.10*a, m-0.05*a,   // P wave
      m, m,                             // PR
      m+0.09*a,                         // Q
      m-0.18*a, m-0.50*a, m-0.18*a,   // R (spike up)
      m+0.22*a, m+0.10*a,              // S dip
      m, m, m,                          // ST
      m-0.06*a, m-0.13*a, m-0.06*a,   // T wave
      m, m, m, m,
    ];
  }

  _next() {
    if (++this.fc >= this.fpb) {
      this.fc = 0;
      this.q.push(...this._spike());
      if (this.onBeat) this.onBeat();
    }
    return this.q.length ? this.q.shift() : 0.5 + (Math.random() - .5) * 0.007;
  }

  _draw() {
    const { c, x, buf, color } = this;
    const W = c.clientWidth, H = c.clientHeight;

    buf.shift();
    buf.push(this._next());

    x.clearRect(0, 0, W, H);

    const g = x.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0,    color + '00');
    g.addColorStop(0.35, color + '28');
    g.addColorStop(0.72, color + 'aa');
    g.addColorStop(1,    color);

    x.beginPath();
    x.strokeStyle = g;
    x.lineWidth = 2;
    x.lineJoin = 'round';
    x.shadowBlur = 14;
    x.shadowColor = color;

    const n = buf.length;
    for (let i = 0; i < n; i++) {
      const px = (i / (n - 1)) * W;
      const py = buf[i] * H;
      i === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
    }
    x.stroke();

    this.raf = requestAnimationFrame(() => this._draw());
  }

  start() { this._draw(); }
  stop()  { cancelAnimationFrame(this.raf); }
}

// ─── APP ─────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const App = {
  stage: -1,
  taps:   0,
  myTap: false,
  ecg:   null,

  init() {
    this.ecg = new ECG($('ecg'));
    this.ecg.onBeat = () => {
      const el = $('bpm-num');
      el.classList.remove('beating');
      void el.offsetWidth;
      el.classList.add('beating');
    };
    this.ecg.start();

    $('tap-btn').addEventListener('click', () => this._tap());

    this._poll();
    setInterval(() => this._poll(), CONFIG.pollMs);
  },

  async _tap() {
    if (this.stage < 4) return;

    await Backend.tap();
    this.myTap = true;

    const btn = $('tap-btn');
    btn.classList.add('donated');
    $('tap-label').textContent = 'DONATED';
    $('tap-icon').textContent = '✅';

    // Ripple
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.color = this.myTap ? '#00e87a' : '#ff3b5c';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 900);

    if (navigator.vibrate) navigator.vibrate(60);
  },

  async _poll() {
    try {
      const state = await Backend.getState();

      $('status-dot').classList.add('live');
      $('status-text').textContent = 'LIVE';

      // Update tap count
      if (state.taps !== this.taps) {
        this.taps = state.taps || 0;
        $('tap-total').textContent =
          `${this.taps} ${this.taps === 1 ? 'person' : 'people'} donated`;
      }

      if (state.stage !== this.stage) {
        this._applyStage(state.stage, state.taps || 0);
      } else if (state.stage === 6) {
        this._countTo($('saved-num'), state.taps || 0);
      }
    } catch (_) {}
  },

  _applyStage(id, taps) {
    const s = STAGES[id];
    if (!s) return;

    const prev = this.stage;
    this.stage = id;

    if (s.vibrate && navigator.vibrate) navigator.vibrate(s.vibrate);

    // ECG update
    this.ecg.set(s.bpm, s.amp, s.color);

    // BPM display
    const bpmEl = $('bpm-num');
    bpmEl.textContent = s.bpm;
    bpmEl.style.color = s.color;
    bpmEl.style.textShadow = `0 0 50px ${s.color}`;

    // Background
    document.getElementById('app').style.background = s.bg;
    document.body.style.background = s.bg;

    // Connecting overlay
    if (id === 0) {
      $('connecting').classList.remove('gone');
    } else if (prev === 0) {
      $('connecting').classList.add('gone');
    }

    // Message — fade out then in
    const msgEl = $('msg');
    msgEl.classList.remove('show-msg');
    setTimeout(() => {
      $('msg-title').textContent = s.title;
      $('msg-sub').textContent   = s.sub;
      if (s.title || s.sub) msgEl.classList.add('show-msg');
    }, 280);

    // Tap overlay
    id >= 4 && id <= 5
      ? $('tap-overlay').classList.add('on')
      : $('tap-overlay').classList.remove('on');

    // Saved overlay
    if (s.saved) {
      $('saved-num').textContent = taps;
      $('saved').classList.add('on');
      this._confetti();
    } else {
      $('saved').classList.remove('on');
    }
  },

  _countTo(el, target) {
    const cur = parseInt(el.textContent) || 0;
    if (cur === target) return;
    const dur = 700, t0 = performance.now();
    const tick = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(cur + (target - cur) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },

  _confetti() {
    const cols = ['#00e87a','#0af','#ff3b5c','#fff','#ffd700','#ff8c00'];
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'conf';
        const sz = 5 + Math.random() * 8;
        el.style.cssText = `
          left:${Math.random()*100}vw;
          width:${sz}px; height:${sz}px;
          background:${cols[~~(Math.random()*cols.length)]};
          border-radius:${Math.random()>.5?'50%':'3px'};
          animation-duration:${2+Math.random()*2.5}s;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }, i * 45);
    }
  }
};

App.init();
</script>
</body>
</html>
